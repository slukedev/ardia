name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, as committed in MARKETING_VERSION (0.2.42 or 0.2.42-nightly.1)
        type: string
        required: true
      dry_run:
        description: Dry run, a release candidate that publishes nothing
        type: boolean
        default: true
      iphone:
        description: Also build the pinned iPhone TestFlight version. Enable only when the owner asks for TestFlight. A real run uploads to Internal after the Mac release publishes.
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  TURBO_TELEMETRY_DISABLED: 1
  VERSION: ${{ inputs.version }}
  DRY_RUN: ${{ inputs.dry_run }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tree: ${{ steps.plan.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          IPHONE: ${{ inputs.iphone }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          check() { if [ "$DRY_RUN" = true ]; then echo "::warning::$* (a real release would stop here)"; else fail "$*"; fi; }
          . scripts/lib/releases.sh
          channel=$(channel_of "$VERSION") || fail "$VERSION is neither <major>.<minor>.<patch> nor <next stable>-nightly.<n>"
          project=$(sed -n 's/.*MARKETING_VERSION = "\{0,1\}\([^";]*\)"\{0,1\};/\1/p' apps/browser/macos/Ardia.xcodeproj/project.pbxproj | sort -u)
          [ "$project" = "$VERSION" ] || check "MARKETING_VERSION is $project: commit the bump to $VERSION first"
          [ -f "docs/release-notes/$VERSION.md" ] || check "no docs/release-notes/$VERSION.md: write and commit the notes first"
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then check "v$VERSION is already published"; fi
          tree=$(engine/engine-key.sh)
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          {
            echo "### Ardia $VERSION ($channel)"
            echo "- commit \`$GITHUB_SHA\`, engine tree \`${tree:0:12}\`"
            if [ "$DRY_RUN" = true ]; then echo "- dry run: a release candidate, nothing published"; else echo "- publishes"; fi
            if [ "$IPHONE" = true ]; then echo "- iPhone: TestFlight's pinned version, $([ "$DRY_RUN" = true ] && echo "built and signed, not uploaded" || echo "sent to TestFlight's Internal group after the Mac release")"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  checks:
    needs: preflight
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .turbo/cache
          key: turbo-${{ github.sha }}
          restore-keys: turbo-
      - run: pnpm typecheck
      - if: ${{ !cancelled() }}
        run: pnpm test
      - if: ${{ !cancelled() }}
        run: pnpm shaders:check

  build:
    needs: preflight
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      CAS_PATH: ${{ github.workspace }}/.xcode-cas
      DERIVED_DATA: ${{ github.workspace }}/apps/browser/build-release-ci
      TREE: ${{ needs.preflight.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: paths
        run: |
          if [ "$DRY_RUN" = true ]; then dist="dist/$VERSION-rc"; else dist="dist/$VERSION"; fi
          echo "dist=$dist" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: apps/browser/build-ardiacore/prebuilt
          key: engine-${{ env.TREE }}
      - name: Engine
        run: |
          if ! framework=$(packages/ardiacore/scripts/fetch-engine.sh); then
            echo "::error::no engine for ${TREE:0:12}: build it here and publish it with scripts/publish-engine.sh, then commit prebuilt-engines.tsv"
            exit 1
          fi
          { echo "ARDIACORE_FRAMEWORK=$framework"; echo "ARDIACORE_FRAMEWORK_ENGINE=$TREE"; } >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: cas-key
        run: echo "prefix=xcode-cas-release-$(xcodebuild -version | awk '/Build version/ { print $3 }')-$(date -u +%Y-%m)-" >> "$GITHUB_OUTPUT"
      - id: cas
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .xcode-cas
          key: ${{ steps.cas-key.outputs.prefix }}${{ github.sha }}
          restore-keys: ${{ steps.cas-key.outputs.prefix }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            apps/browser/macos/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('apps/browser/macos/Podfile', 'apps/browser/macos/Podfile.lock', 'pnpm-lock.yaml', 'patches/**') }}
          restore-keys: pods-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: packages/ardiacore/vendor/ubo
          key: ubo-${{ hashFiles('packages/ardiacore/scripts/ubo.sh') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: packages/ardiacore/vendor/ubol-webkit
          key: ubol-webkit-${{ hashFiles('packages/ardiacore/scripts/ubol.sh', 'packages/ardiacore/scripts/ubol-webkit.py') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: packages/ardiacore/vendor/hsts-preload
          key: hsts-preload-${{ hashFiles('packages/ardiacore/scripts/hsts-preload.sh', 'packages/ardiacore/scripts/hsts-preload.py') }}
      - name: Pods
        working-directory: apps/browser/macos
        run: pod install
      - name: Tree is clean
        run: |
          pbx=apps/browser/macos/Ardia.xcodeproj/project.pbxproj
          unquote() { sed -E 's/^[-+]//; s/"//g'; }
          removed=$(git diff -U0 -- "$pbx" | { grep '^-[^-]' || true; } | unquote)
          added=$(git diff -U0 -- "$pbx" | { grep '^+[^+]' || true; } | unquote)
          if [ -n "$removed$added" ] && [ "$removed" = "$added" ]; then
            echo "::notice::pod install only quoted MARKETING_VERSION: kept, not counted as changes"
            git update-index --assume-unchanged "$pbx"
          fi
          dirty=$(git status --porcelain -- apps/browser packages engine scripts/dmg | grep -v ' apps/browser/build' || true)
          [ -z "$dirty" ] || {
            echo "::error::installing changed tracked files, so release.sh would refuse the tree:"
            echo "$dirty"
            git diff -- apps/browser packages engine scripts/dmg | head -150
            exit 1
          }
      - name: Build
        run: |
          args=("$VERSION" --phase build)
          if [ "$DRY_RUN" = true ]; then args+=(--rc); fi
          if ! curl -fsIL -o /dev/null "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml"; then
            echo "::notice::the latest release has no appcast.xml: this release starts it"
            export APPCAST_BASE=none
          fi
          export RELEASE_BUILD_DIR="$DERIVED_DATA"
          export RELEASE_BUILD_SETTINGS="COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH=$CAS_PATH"
          scripts/release.sh "${args[@]}"
      - name: Pack the build
        env:
          DIST: ${{ steps.paths.outputs.dist }}
        run: |
          COPYFILE_DISABLE=1 tar --no-mac-metadata -cf "$RUNNER_TEMP/build.tar" -C "$DIST" Ardia.xcarchive provenance.txt plugins
      - if: always() && steps.cas.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .xcode-cas
          key: ${{ steps.cas-key.outputs.prefix }}${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: build
          path: ${{ runner.temp }}/build.tar
          if-no-files-found: error
          retention-days: 3
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: build-logs
          path: ${{ steps.paths.outputs.dist }}/*.log
          if-no-files-found: ignore
          retention-days: 14

  sign:
    needs: [preflight, build]
    runs-on: xcode-27
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: paths
        run: |
          if [ "$DRY_RUN" = true ]; then dist="dist/$VERSION-rc"; else dist="dist/$VERSION"; fi
          echo "dist=$dist" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: build
          path: ${{ runner.temp }}/build-download
      - name: Unpack the build
        run: |
          /usr/bin/python3 -I .github/release/unpack-build.py "$RUNNER_TEMP/build-download/build.tar" "$RUNNER_TEMP/build-in" "$VERSION"
          rm -rf "$RUNNER_TEMP/build-download"
      - name: Sparkle's tools
        run: |
          tarball="$RUNNER_TEMP/Sparkle-2.9.6.tar.xz"
          curl -fsSL --retry 3 -o "$tarball" https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-2.9.6.tar.xz
          [ "$(shasum -a 256 "$tarball" | awk '{ print $1 }')" = 52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192 ] \
            || { echo "::error::Sparkle-2.9.6.tar.xz didn't match its pinned SHA-256"; exit 1; }
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$tarball" -C "$RUNNER_TEMP/sparkle" bin
          echo "SPARKLE_BIN=$RUNNER_TEMP/sparkle/bin" >> "$GITHUB_ENV"
      - name: Signing
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          ALLOW_MISSING_NOTARY: ${{ inputs.dry_run && '1' || '0' }}
        run: .github/release/signing.sh setup
      - name: Sign, notarize, package
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          export RELEASE_BUILD_INPUT="$RUNNER_TEMP/build-in"
          args=("$VERSION" --phase sign)
          if [ "$DRY_RUN" = true ]; then args+=(--rc); fi
          if ! curl -fsIL -o /dev/null "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml"; then
            export APPCAST_BASE=none
          fi
          scripts/release.sh "${args[@]}"
      - if: always()
        name: Remove signing
        run: |
          secrets="$RUNNER_TEMP/release-signing"
          if [ -f "$secrets/release.keychain-db" ]; then security delete-keychain "$secrets/release.keychain-db" || true; fi
          rm -rf "$secrets"
          printf '%s=\n' RELEASE_PROVISIONING_PROFILE SPARKLE_KEY_FILE NOTARY_KEY >> "$GITHUB_ENV"
          [ ! -e "$secrets" ] || { echo "::error::couldn't remove $secrets"; exit 1; }
          if security find-identity -v -p codesigning | grep -q 'Developer ID Application: .*(U5L5T3NGVV)'; then
            echo "::error::a Developer ID identity is still in the keychain search list"
            exit 1
          fi
          echo "signing keychain and key files removed"
      - name: Checkout untouched
        run: |
          changed=$(git status --porcelain --untracked-files=all -- . ':!dist')
          [ -z "$changed" ] || { echo "::error::signing changed files in the checkout:"; echo "$changed"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Launch check
        run: |
          args=("$VERSION" --phase check)
          if [ "$DRY_RUN" = true ]; then args+=(--rc); fi
          scripts/release.sh "${args[@]}"
      - name: Update signature
        env:
          DIST: ${{ steps.paths.outputs.dist }}
        run: .github/release/check-sparkle.sh "$DIST" "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release
          path: |
            ${{ steps.paths.outputs.dist }}/Ardia-${{ inputs.version }}.dmg
            ${{ steps.paths.outputs.dist }}/Ardia-${{ inputs.version }}.zip
            ${{ steps.paths.outputs.dist }}/appcast.xml
            ${{ steps.paths.outputs.dist }}/release-notes.md
            ${{ steps.paths.outputs.dist }}/provenance.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sign-logs
          path: ${{ steps.paths.outputs.dist }}/*.log
          if-no-files-found: ignore
          retention-days: 14

  linux:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TREE: ${{ needs.preflight.outputs.tree }}
      ARDIACORE_PREBUILT_REPO: ${{ vars.ARDIACORE_PREBUILT_REPO || 'ardia-browser/ardia' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-setup
        with:
          packages: >-
            libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libatspi2.0-0t64 libcups2t64 libdbus-1-3
            libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 libxkbcommon0
            libgbm1 libdrm2 libexpat1 libcairo2 libpango-1.0-0 libudev1 libasound2t64 libglib2.0-0t64
            libgtk-3-0t64 libsecret-1-0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: apps/browser/build-ardiacore/prebuilt-linux-x86_64
          key: engine-linux-x64-v3-${{ env.TREE }}-${{ hashFiles('packages/ardiacore/prebuilt-engines-linux.tsv') }}
          restore-keys: engine-linux-x64-v3-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: packages/ardiacore/vendor/ubo
          key: ubo-linux-${{ hashFiles('packages/ardiacore/scripts/ubo.sh') }}
      - name: Build, package, smoke
        run: |
          if ! scripts/linux/release.sh "$VERSION" --engine exact --out "$RUNNER_TEMP/linux"; then
            echo "::error::no Linux build for $VERSION (above). A missing engine for ${TREE:0:12} means: build it on the Linux builder, publish it with scripts/linux/publish-engine.sh --upload and commit prebuilt-engines-linux.tsv"
            exit 1
          fi
      - name: Debian package installs
        id: deb-install
        continue-on-error: true
        run: scripts/linux/deb-install-test.sh "$RUNNER_TEMP/linux/Ardia-$VERSION-linux-x64.deb"
      - name: Drop the .deb that failed its install test
        if: steps.deb-install.outcome == 'failure'
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/linux/Ardia-$VERSION-linux-x64.deb" "$RUNNER_TEMP/linux/Ardia-$VERSION-linux-x64.deb.sha256"
          echo "deb dropped: it failed scripts/linux/deb-install-test.sh in run $GITHUB_RUN_ID" >> "$RUNNER_TEMP/linux/provenance.txt"
          echo "::warning::Ardia-$VERSION-linux-x64.deb failed its install test (above), so the release ships without it; the tarball, AppImage, Arch source package and CLI still ship"
          echo "- Linux: the .deb failed its install test and is left out" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux
          path: |
            ${{ runner.temp }}/linux/Ardia-${{ inputs.version }}-linux-x64.tar.xz
            ${{ runner.temp }}/linux/Ardia-${{ inputs.version }}-linux-x64.tar.xz.sha256
            ${{ runner.temp }}/linux/Ardia-${{ inputs.version }}-linux-x64.deb
            ${{ runner.temp }}/linux/Ardia-${{ inputs.version }}-linux-x64.deb.sha256
            ${{ runner.temp }}/linux/Ardia-${{ inputs.version }}-linux-x64.AppImage
            ${{ runner.temp }}/linux/Ardia-${{ inputs.version }}-linux-x64.AppImage.sha256
            ${{ runner.temp }}/linux/ardia-bin-${{ inputs.version }}.src.tar.gz
            ${{ runner.temp }}/linux/ardia-bin-${{ inputs.version }}.src.tar.gz.sha256
            ${{ runner.temp }}/linux/ardia-cli-${{ inputs.version }}-linux-x64.tar.gz
            ${{ runner.temp }}/linux/ardia-cli-${{ inputs.version }}-linux-x64.tar.gz.sha256
            ${{ runner.temp }}/linux/provenance.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-logs
          path: |
            ${{ runner.temp }}/linux/*.log
            ${{ runner.temp }}/linux/smoke
            ${{ runner.temp }}/linux/smoke-deb
            ${{ runner.temp }}/linux/smoke-appimage
          if-no-files-found: ignore
          retention-days: 14

  linux-sign:
    needs: [linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux
          path: ${{ runner.temp }}/linux
      - name: Sign the self-update manifest
        env:
          LINUX_UPDATE_ED_PRIVATE_KEY: ${{ secrets.LINUX_UPDATE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$LINUX_UPDATE_ED_PRIVATE_KEY" ]; then
            echo "::error::no LINUX_UPDATE_ED_PRIVATE_KEY secret, so v$VERSION can't carry a signed Linux self-update manifest"
            exit 1
          fi
          key="$RUNNER_TEMP/linux-update-key.pem"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$LINUX_UPDATE_ED_PRIVATE_KEY" > "$key"
          (cd "$RUNNER_TEMP/linux" && sha256sum -c --quiet ./*.sha256)
          node scripts/linux/sign-update.mjs --key "$key" --dir "$RUNNER_TEMP/linux" --version "$VERSION"
          mkdir -p "$RUNNER_TEMP/linux-update"
          mv "$RUNNER_TEMP/linux/Ardia-$VERSION-linux-update.txt" "$RUNNER_TEMP/linux/Ardia-$VERSION-linux-update.txt.sig" "$RUNNER_TEMP/linux-update/"
          {
            echo "- Linux: self-update manifest signed"
            sed 's/^/    /' "$RUNNER_TEMP/linux-update/Ardia-$VERSION-linux-update.txt"
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        name: Remove the key
        run: rm -f "$RUNNER_TEMP/linux-update-key.pem"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-update
          path: |
            ${{ runner.temp }}/linux-update/Ardia-${{ inputs.version }}-linux-update.txt
            ${{ runner.temp }}/linux-update/Ardia-${{ inputs.version }}-linux-update.txt.sig
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: preflight
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ inputs.version }}

  publish:
    needs: [preflight, checks, sign, linux, linux-sign, windows]
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.sign.result == 'success' }}
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release
          path: dist/${{ inputs.version }}
      - if: needs.linux.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux
          path: dist/${{ inputs.version }}/linux
      - name: Linux assets
        if: needs.linux.result != 'success'
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
        run: |
          echo "::warning::the Linux job ended $LINUX_RESULT, so v$VERSION ships without the Linux tarball: build it with scripts/linux/release.sh and upload it by hand once the engine is published"
          echo "- Linux: skipped (the linux job ended $LINUX_RESULT)" >> "$GITHUB_STEP_SUMMARY"
      - if: needs.linux.result == 'success' && needs.linux-sign.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux-update
          path: dist/${{ inputs.version }}/linux
      - name: Linux self-update manifest
        if: needs.linux.result == 'success' && needs.linux-sign.result != 'success'
        env:
          SIGN_RESULT: ${{ needs.linux-sign.result }}
        run: |
          echo "::warning::the linux-sign job ended $SIGN_RESULT, so v$VERSION ships without Ardia-$VERSION-linux-update.txt and installed Linux apps can't update themselves to it: sign it with scripts/linux/sign-update.mjs and upload the manifest and its .sig by hand"
          echo "- Linux: no self-update manifest (the linux-sign job ended $SIGN_RESULT)" >> "$GITHUB_STEP_SUMMARY"
      - if: needs.windows.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: windows-release-*
          merge-multiple: true
          path: dist/${{ inputs.version }}/windows
      - name: Windows assets
        if: needs.windows.result != 'success'
        env:
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          echo "::warning::the Windows job ended $WINDOWS_RESULT, so v$VERSION ships without the Windows installers and installed Windows apps aren't offered it: see docs/windows.md › Releases to add them"
          echo "- Windows: skipped (the windows job ended $WINDOWS_RESULT)" >> "$GITHUB_STEP_SUMMARY"
      - name: Tag
        if: ${{ !inputs.dry_run }}
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"
      - name: Publish
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          export RELEASE_DIST="$GITHUB_WORKSPACE/dist/$VERSION"
          if [ -n "$TAP_TOKEN" ]; then
            git config --global url."https://x-access-token:$TAP_TOKEN@github.com/ardia-browser/homebrew-tap".insteadOf https://github.com/ardia-browser/homebrew-tap
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          else
            export PUBLISH_TAP=0
          fi
          if [ "$DRY_RUN" = true ]; then
            .claude/skills/release/scripts/publish.sh "$VERSION" --dry-run
          else
            .claude/skills/release/scripts/publish.sh "$VERSION"
          fi

  windows-update:
    needs: [publish, windows]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: windows-release-*
          merge-multiple: true
          path: ${{ runner.temp }}/windows
      - name: Offer it to installed Windows apps
        env:
          BUILD: ${{ needs.windows.outputs.build }}
        run: |
          args=(--installers "$RUNNER_TEMP/windows" --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/windows-alpha")
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          scripts/windows/publish-alpha.sh "${args[@]}"
          if [ "$DRY_RUN" = true ]; then
            echo "- Windows: build $BUILD, packed for windows-alpha, not published" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Windows: build $BUILD is the update on windows-alpha" >> "$GITHUB_STEP_SUMMARY"
          fi

  aur:
    needs: [preflight, linux, publish]
    continue-on-error: true
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.publish.result == 'success' && !contains(inputs.version, '-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux
          path: ${{ runner.temp }}/linux
      - name: ardia-bin
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_GIT_NAME: ${{ vars.AUR_GIT_NAME }}
          AUR_GIT_EMAIL: ${{ vars.AUR_GIT_EMAIL }}
        run: |
          set -euo pipefail
          sha=$(cut -d' ' -f1 "$RUNNER_TEMP/linux/Ardia-$VERSION-linux-x64.tar.xz.sha256")
          args=("$VERSION" --sha256 "$sha")
          if [ "$DRY_RUN" = true ]; then
            args+=(--dry-run)
          elif [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::warning::no AUR_SSH_PRIVATE_KEY secret, so ardia-bin stays where it is: run scripts/linux/arch/publish-aur.sh $VERSION --sha256 $sha"
            echo "- AUR: not updated (no AUR_SSH_PRIVATE_KEY secret)" >> "$GITHUB_STEP_SUMMARY"
            args+=(--dry-run)
          else
            export AUR_SSH_KEY_FILE="$RUNNER_TEMP/aur-key"
            install -m 600 /dev/null "$AUR_SSH_KEY_FILE"
            printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$AUR_SSH_KEY_FILE"
          fi
          AUR_OUT="$RUNNER_TEMP/aur" scripts/linux/arch/publish-aur.sh "${args[@]}"
      - if: always()
        run: rm -f "$RUNNER_TEMP/aur-key"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: aur
          path: ${{ runner.temp }}/aur
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  iphone:
    needs: [preflight, publish]
    if: ${{ inputs.iphone }}
    uses: ./.github/workflows/ios-release.yml
    with:
      mode: ${{ inputs.dry_run && 'dry-run' || 'upload' }}
    secrets: inherit
